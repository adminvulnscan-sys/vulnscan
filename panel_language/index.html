<!doctype html><html lang="es"><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent;color:#edf4fc;font:13px Arial,sans-serif}body{padding:2px}.language-picker{position:relative}.language-picker>summary{display:flex;align-items:center;justify-content:flex-end;gap:7px;border:1px solid #34475a;border-radius:6px;padding:9px 10px;font-size:12px;cursor:pointer;width:max-content;margin-left:auto;list-style:none;background:#101d2d}.language-picker>summary::-webkit-details-marker{display:none}.language-code{text-transform:uppercase}.flag{width:22px;height:15px;flex-shrink:0;border-radius:2px}.language-picker>summary .flag{display:none}body[data-lang="es"] summary .flag-es,body[data-lang="en"] summary .flag-en{display:block}.language-options{position:absolute;right:0;top:calc(100% + 8px);background:#101d2d;border:1px solid #35495d;border-radius:8px;padding:6px;min-width:160px;box-shadow:0 16px 36px #0006}.language-options button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 10px;background:none;border:0;border-radius:4px;color:#edf4fc;font:inherit;cursor:pointer}.language-options button:hover{background:#1e3546}.chosen{margin-left:auto;visibility:hidden;color:#63e2ce}[aria-pressed="true"] .chosen{visibility:visible}button:focus-visible,summary:focus-visible{outline:2px solid #63e2ce;outline-offset:2px}</style></head><body data-lang="es"><details class="language-picker"><summary aria-label="Idioma / Language"><svg class="flag flag-es" viewBox="0 0 24 16" aria-hidden="true"><path fill="#aa151b" d="M0 0h24v16H0z"/><path fill="#f1bf00" d="M0 4h24v8H0z"/></svg><svg class="flag flag-en" viewBox="0 0 24 16" aria-hidden="true"><path fill="#17356b" d="M0 0h24v16H0z"/><path stroke="#fff" stroke-width="4" d="m0 0 24 16M24 0 0 16"/><path stroke="#c62e3b" stroke-width="1.5" d="m0 0 24 16M24 0 0 16"/><path stroke="#fff" stroke-width="6" d="M12 0v16M0 8h24"/><path stroke="#c62e3b" stroke-width="3" d="M12 0v16M0 8h24"/></svg><span class="language-code">es</span><span aria-hidden="true">&#8964;</span></summary><div class="language-options"><button type="button" data-language="es"><svg class="flag flag-es" viewBox="0 0 24 16" aria-hidden="true"><path fill="#aa151b" d="M0 0h24v16H0z"/><path fill="#f1bf00" d="M0 4h24v8H0z"/></svg><span lang="es">Espa&#241;ol</span><span class="chosen" aria-hidden="true">&#10003;</span></button><button type="button" data-language="en"><svg class="flag flag-en" viewBox="0 0 24 16" aria-hidden="true"><path fill="#17356b" d="M0 0h24v16H0z"/><path stroke="#fff" stroke-width="4" d="m0 0 24 16M24 0 0 16"/><path stroke="#c62e3b" stroke-width="1.5" d="m0 0 24 16M24 0 0 16"/><path stroke="#fff" stroke-width="6" d="M12 0v16M0 8h24"/><path stroke="#c62e3b" stroke-width="3" d="M12 0v16M0 8h24"/></svg><span lang="en">English</span><span class="chosen" aria-hidden="true">&#10003;</span></button></div></details><script>const picker=document.querySelector('details');const send=(type,extra={})=>window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
function size(){send('streamlit:setFrameHeight',{height:picker.open?162:42});}
function language(lang){document.body.dataset.lang=lang;document.documentElement.lang=lang;document.querySelector('.language-code').textContent=lang;document.querySelectorAll('[data-language]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.language===lang)));}
picker.addEventListener('toggle',size);
document.querySelectorAll('[data-language]').forEach(button=>button.addEventListener('click',()=>{language(button.dataset.language);picker.open=false;size();send('streamlit:setComponentValue',{value:{language:button.dataset.language,event:Date.now()},dataType:'json'});picker.querySelector('summary').focus();}));
document.addEventListener('keydown',event=>{if(event.key==='Escape'){picker.open=false;picker.querySelector('summary').focus();}if(event.key==='ArrowDown'&&event.target.tagName==='SUMMARY'){event.preventDefault();picker.open=true;picker.querySelector('button').focus();}});
window.addEventListener('message',event=>{if(event.source!==window.parent||event.data.type!=='streamlit:render')return;language(event.data.args.language);size();});
send('streamlit:componentReady',{apiVersion:1});</script></body></html>
